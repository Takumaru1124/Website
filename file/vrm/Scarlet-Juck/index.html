        }

            color: #333;

            transition: color 0.3s;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;           /* ← 追加 */
            justify-content: flex-end; /* 右寄せを維持 */
        }
        
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 2rem;
            background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0)), center/cover no-repeat;
            color: white;
        }
        
        .hero-content {

        }

            margin-bottom: 1rem;
        }
        
        .hero p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #4a6cf7;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #3b5be0;
            transform: translateY(-3px);
        }
        
        section {
            padding: 100px 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h2 {
            text-align: center;
            font-size: 2.8rem;
            color: #222;
        }
        
        .p {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .about {
            background: white;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
        }
        
        .card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .card-img {
            width: 40vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 2rem;
        }
        
        .card:hover {
            transform: translateY(-10px);
        }
        
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 3rem 2rem;
        }
        
        @media (max-width: 768px) {
            .nav-links {
                gap: 1.2rem;
                font-size: 0.95rem;
                justify-content: center;     /* 中央寄せにして見やすく */
                padding-top: 0.8rem;         /* ロゴと間隔を空ける */
        }

    <script>
        // スムーズスクロール
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
